name: refresh ip ranges

# Keeps the destination-attribution table honest. A hand-written range table is
# correct the day it is written and silently wrong later, with nothing to detect
# the drift -- its first run caught two live errors: an Anthropic range that was
# /23 where ARIN says /21, and three ranges labelled "openai" that RDAP shows
# registered to Microsoft.
#
# The network call lives HERE and nowhere else. The MCP server reads the
# generated file and does offline CIDR containment, so it stays deterministic,
# deployable in restricted-egress environments, and never sends customer
# destination IPs to a third party.
#
# Output is a pull request, never a direct push: a range change alters what the
# tool reports about customer traffic, so it gets reviewed like any other
# behaviour change.

on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays, off the hour to avoid the stampede
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh ranges from RDAP and vendor-published lists
        id: refresh
        # The script exits 1 when it hit a problem worth a human's attention
        # (a fetch failure, or a range that changed hands) but still wrote a
        # valid table. That is a reason to flag the PR, not to fail the job --
        # failing here would leave the table stale, which is the thing we are
        # trying to prevent.
        run: |
          set +e
          python scripts/refresh_ip_ranges.py 2>refresh-warnings.txt
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat refresh-warnings.txt >&2 || true
          {
            echo 'warnings<<WARN_EOF'
            cat refresh-warnings.txt 2>/dev/null || true
            echo 'WARN_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Verify the refreshed table still attributes correctly
        # A table that parses but attributes nothing would sail through review
        # as an innocuous-looking diff. Deliberately stdlib-only: this job
        # installs no dependencies, and the runtime loader is covered by
        # tests/test_ip_range_refresh.py in the main suite.
        run: |
          python - <<'PY'
          import ipaddress, json, sys

          doc = json.load(open("src/illumio_mcp/data/ip_ranges.json"))
          entries = doc.get("entries") or []
          assert entries, "refreshed table is empty"

          compiled = [(e["provider"], e["confidence"],
                       [ipaddress.ip_network(c) for c in e["cidrs"]])
                      for e in entries]

          def classify(ip):
              addr = ipaddress.ip_address(ip)
              for provider, confidence, nets in compiled:
                  if any(addr in n for n in nets if n.version == addr.version):
                      return provider, confidence
              return None, None

          assert classify("160.79.104.100") == ("anthropic", "likely"), \
              f'known Anthropic address now attributes as {classify("160.79.104.100")}'
          assert classify("192.0.2.1") == (None, None), \
              "documentation-range address must not match any provider"

          total = sum(len(n) for _, _, n in compiled)
          print(f"OK: {len(compiled)} providers, {total} ranges, attribution verified")
          PY

      - name: Open a pull request if the table changed
        uses: peter-evans/create-pull-request@v6
        with:
          add-paths: src/illumio_mcp/data/ip_ranges.json
          branch: chore/refresh-ip-ranges
          delete-branch: true
          title: 'chore(data): refresh destination attribution IP ranges'
          commit-message: |
            chore(data): refresh destination attribution IP ranges

            Regenerated by scripts/refresh_ip_ranges.py from RDAP and
            vendor-published lists. Review the CIDR diff: these ranges decide
            what the egress tools report about customer traffic.
          body: |
            Automated weekly refresh of `src/illumio_mcp/data/ip_ranges.json`.

            **Review the CIDR diff.** These ranges decide what
            `discover-process-egress` reports about customer traffic. A widened
            range attributes more traffic to a vendor; a narrowed one silently
            stops attributing traffic that is still going there.

            Attribution was verified to still work before this PR was opened
            (a known Anthropic address resolves, a documentation-range address
            does not).

            Script exit code: `${{ steps.refresh.outputs.exit_code }}`
            (non-zero means it wrote a valid table but hit something worth a
            look -- see warnings below).

            ```
            ${{ steps.refresh.outputs.warnings }}
            ```
