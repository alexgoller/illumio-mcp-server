[project]
name = "illumio-mcp"
version = "0.1.0"
description = "A MCP server project"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
 "illumio>=1.1.3",
 # NOTE: no "logging" dependency. The PyPI `logging` distribution is a 2005
 # Python-2-era backport; `import logging` always resolves to the stdlib, so
 # depending on it added supply-chain surface for no benefit.
 "mcp>=1.28.1,<2",
 "pandas>=2.2.3",
 "pyjwt[crypto]>=2.13.0",
 "python-dotenv>=1.2.2",
 "starlette>=1.3.1",
 "uvicorn[standard]>=0.34.0",
]

# Security floors for transitive dependencies. These are not imported directly,
# so they are constraints rather than dependencies: they raise the floor without
# claiming the project depends on them. Each is the lowest version with no known
# advisory per OSV. Re-check with the OSV querybatch API when bumping.
[tool.uv]
constraint-dependencies = [
 "click>=8.3.3",
 "cryptography>=50.0.0",
 "h11>=0.16.0",
 "idna>=3.15",
 "python-multipart>=0.0.31",
 "requests>=2.33.0",
 "urllib3>=2.7.0",
]
[[project.authors]]
name = "alexgoller"
email = "83632450+alexgoller@users.noreply.github.com"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
illumio-mcp = "illumio_mcp:main"
illumio-mcp-http = "illumio_mcp:serve_http_cli"

[tool.hatch.build.targets.wheel]
packages = ["src/illumio_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
