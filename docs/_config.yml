title: Illumio MCP Server
description: Manage Illumio PCE segmentation from any MCP client — 50 tools, guided workflows, and an embedded segmentation knowledge base.
remote_theme: just-the-docs/just-the-docs@v0.10.1
url: https://alexgoller.github.io
baseurl: /illumio-mcp-server

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

# Internal planning specs are not part of the published documentation.
exclude:
  - superpowers/
  - README.md
  # Point-in-time security review. Several findings are not yet remediated
  # (rate limiting, security headers, Cache-Control, SSRF guard on pce_host),
  # and this is a server people self-deploy -- publishing exploitation detail
  # for live issues is a maintainer decision, not a default. Remove this line
  # to publish it once the findings are closed.
  - security/2026-05-13-security-review.md

color_scheme: dark
search_enabled: true
heading_anchors: true

aux_links:
  GitHub: https://github.com/alexgoller/illumio-mcp-server

nav_external_links:
  - title: View on GitHub
    url: https://github.com/alexgoller/illumio-mcp-server

callouts:
  warning:
    title: Warning
    color: red
  note:
    title: Note
    color: blue
  caution:
    title: Caution
    color: yellow

footer_content: >
  Community project, not an official Illumio product.
  Licensed under GPL-3.0.
